<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      width: 280px;
      margin: 0;
      padding: 14px;
      background: #16181d;
      color: #e8eaed;
    }
    h1 { font-size: 15px; margin: 0 0 12px; }
    label { display: block; font-size: 12px; margin: 10px 0 4px; color: #aab; }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0e0f12;
      color: #e8eaed;
    }
    input[type="range"] { width: 100%; }
    .row { display: flex; align-items: center; justify-content: space-between; }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #3b6cf6;
      color: white;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #2f57c9; }
    #status { font-size: 12px; margin-top: 8px; min-height: 16px; color: #9a9; }
    #status.err { color: #e77; }
  </style>
</head>
<body>
  <h1>SafeSight</h1>

  <div class="row">
    <label for="enabled" style="margin: 0">Protection enabled</label>
    <input type="checkbox" id="enabled" />
  </div>

  <label for="apiUrl">API URL</label>
  <input type="text" id="apiUrl" placeholder="http://127.0.0.1:8000" />

  <label for="apiKeyInput">API key (optional)</label>
  <input type="text" id="apiKeyInput" placeholder="only if the server requires one" />

  <label for="sensitivity">Sensitivity: <span id="sensValue"></span></label>
  <input type="range" id="sensitivity" min="0.30" max="0.80" step="0.05" />

  <button id="save">Save and test connection</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
