<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSight Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 2rem;
        }

        .demo-section {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .demo-section h2 {
            color: #333;
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9fa;
        }

        .upload-area.dragover {
            background: #e9ecef;
            border-color: #764ba2;
        }

        input[type="file"] {
            display: none;
        }

        .url-input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        .url-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: white;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result-safe {
            border-left: 4px solid #28a745;
        }

        .result-nsfw {
            border-left: 4px solid #dc3545;
        }

        .result h3 {
            margin-bottom: 1rem;
        }

        .result-safe h3 {
            color: #28a745;
        }

        .result-nsfw h3 {
            color: #dc3545;
        }

        .result-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .result-item {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 6px;
        }

        .result-item label {
            font-size: 0.85rem;
            color: #6c757d;
            display: block;
            margin-bottom: 0.25rem;
        }

        .result-item value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
            display: none;
        }

        .spinner.show {
            display: block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 6px;
            border-left: 4px solid #dc3545;
            display: none;
        }

        .error.show {
            display: block;
        }

        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-top: 1rem;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stat-card p {
            opacity: 0.9;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SafeSight NSFW Moderation</h1>
            <p>Powered by RQSA-MIL: MobileNetV2 + IoU-conditioned Attention</p>
        </div>

        <div class="content">
            <div class="stats">
                <div class="stat-card">
                    <h3>87.9%</h3>
                    <p>Recall</p>
                </div>
                <div class="stat-card">
                    <h3>85.5%</h3>
                    <p>Specificity</p>
                </div>
                <div class="stat-card">
                    <h3>93.0%</h3>
                    <p>AUC</p>
                </div>
            </div>

            <div class="demo-section">
                <h2>Option 1: Upload Image</h2>
                <div class="upload-area" id="uploadArea">
                    <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin: 0 auto 1rem;">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">Drop image here or click to browse</p>
                    <p style="color: #6c757d; font-size: 0.9rem;">JPG, PNG up to 10MB</p>
                    <input type="file" id="fileInput" accept="image/jpeg,image/png">
                </div>
                <div class="spinner" id="uploadSpinner"></div>
                <div class="result" id="uploadResult"></div>
                <div class="error" id="uploadError"></div>
            </div>

            <div class="demo-section">
                <h2>Option 2: Score Image URL</h2>
                <input type="text" class="url-input" id="urlInput" placeholder="https://example.com/image.jpg">
                <button class="btn" id="scoreUrlBtn">Score Image</button>
                <div class="spinner" id="urlSpinner"></div>
                <div class="result" id="urlResult"></div>
                <div class="error" id="urlError"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8001';

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadSpinner = document.getElementById('uploadSpinner');
        const uploadResult = document.getElementById('uploadResult');
        const uploadError = document.getElementById('uploadError');

        const urlInput = document.getElementById('urlInput');
        const scoreUrlBtn = document.getElementById('scoreUrlBtn');
        const urlSpinner = document.getElementById('urlSpinner');
        const urlResult = document.getElementById('urlResult');
        const urlError = document.getElementById('urlError');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFileUpload(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFileUpload(file);
        });

        scoreUrlBtn.addEventListener('click', () => handleUrlScore());

        async function handleFileUpload(file) {
            uploadResult.classList.remove('show');
            uploadError.classList.remove('show');
            uploadSpinner.classList.add('show');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/v1/score?preset=cascade`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                uploadSpinner.classList.remove('show');

                if (response.ok) {
                    displayResult(uploadResult, data, file);
                } else {
                    showError(uploadError, data.detail || 'Error scoring image');
                }
            } catch (error) {
                uploadSpinner.classList.remove('show');
                showError(uploadError, 'Cannot connect to API. Make sure server is running on port 8001');
            }
        }

        async function handleUrlScore() {
            const url = urlInput.value.trim();
            if (!url) return;

            urlResult.classList.remove('show');
            urlError.classList.remove('show');
            urlSpinner.classList.add('show');

            try {
                const response = await fetch(`${API_BASE}/v1/score-urls`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ urls: [url], preset: 'cascade' })
                });

                const data = await response.json();
                urlSpinner.classList.remove('show');

                if (response.ok && data.results && data.results[0].ok) {
                    displayResult(urlResult, data.results[0], null, url);
                } else {
                    showError(urlError, data.results[0].error || 'Error scoring URL');
                }
            } catch (error) {
                urlSpinner.classList.remove('show');
                showError(urlError, 'Cannot connect to API. Make sure server is running on port 8001');
            }
        }

        function displayResult(container, data, file, imageUrl) {
            const isSafe = data.label === 0;
            container.className = `result show ${isSafe ? 'result-safe' : 'result-nsfw'}`;

            const stages = data.stages ? data.stages.join(' → ') : 'N/A';

            container.innerHTML = `
                <h3>${isSafe ? 'SAFE' : 'NSFW'}</h3>
                ${file ? `<img src="${URL.createObjectURL(file)}" class="preview-image" alt="Preview">` : ''}
                ${imageUrl ? `<img src="${imageUrl}" class="preview-image" alt="Preview" onerror="this.style.display='none'">` : ''}
                <div class="result-details">
                    <div class="result-item">
                        <label>Overall Score</label>
                        <value>${(data.score * 100).toFixed(2)}%</value>
                    </div>
                    <div class="result-item">
                        <label>Large Regions</label>
                        <value>${(data.score_large * 100).toFixed(2)}%</value>
                    </div>
                    <div class="result-item">
                        <label>Patches Analyzed</label>
                        <value>${data.n_patches || 'N/A'}</value>
                    </div>
                    <div class="result-item">
                        <label>Strategy</label>
                        <value style="font-size: 0.9rem;">${stages}</value>
                    </div>
                </div>
            `;
        }

        function showError(container, message) {
            container.textContent = message;
            container.classList.add('show');
        }
    </script>
</body>
</html>
